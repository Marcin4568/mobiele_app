<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voortgang</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Language Switch -->
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 id="pageTitle">Voortgang Tracking</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            <!-- Statistics -->
            <div class="section">
                <h2 id="statsTitle">Statistieken</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="workoutsCompletedLabel">Workouts Voltooid</h3>
                        <p class="stat-number" id="workoutsCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="caloriesBurnedLabel">Calorieën Verbrand</h3>
                        <p class="stat-number" id="caloriesBurned">0</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="streakLabel">Huidige Streak</h3>
                        <p class="stat-number" id="streakDays">0</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="goalsCompletedLabel">Doelen Voltooid</h3>
                        <p class="stat-number" id="goalsCount">0</p>
                    </div>
                </div>
            </div>

            <!-- Body Measurements -->
            <div class="section">
                <h2 id="measurementsTitle">Lichaamsmaten</h2>
                <div class="measurements">
                    <div class="measurement-input">
                        <label id="weightLabel">Gewicht (kg):</label>
                        <input type="number" id="weight" step="0.1" placeholder="70">
                        <button onclick="addMeasurement('weight')" class="btn-primary" id="addWeightBtn">Opslaan</button>
                    </div>
                    <div class="measurement-input">
                        <label id="chestLabel">Borst (cm):</label>
                        <input type="number" id="chest" step="0.1" placeholder="100">
                        <button onclick="addMeasurement('chest')" class="btn-primary" id="addChestBtn">Opslaan</button>
                    </div>
                    <div class="measurement-input">
                        <label id="waistLabel">Taille (cm):</label>
                        <input type="number" id="waist" step="0.1" placeholder="80">
                        <button onclick="addMeasurement('waist')" class="btn-primary" id="addWaistBtn">Opslaan</button>
                    </div>
                    <div class="measurement-input">
                        <label id="bicepLabel">Biceps (cm):</label>
                        <input type="number" id="bicep" step="0.1" placeholder="35">
                        <button onclick="addMeasurement('bicep')" class="btn-primary" id="addBicepBtn">Opslaan</button>
                    </div>
                </div>
            </div>

            <!-- Measurement History -->
            <div class="section">
                <h2 id="historyTitle">Meetgeschiedenis</h2>
                <div id="measurementHistory" class="measurement-history">
                    <p id="noMeasurements">Geen metingen opgeslagen</p>
                </div>
            </div>

            <!-- Progress Chart -->
            <div class="section">
                <h2 id="trendTitle">Trends</h2>
                <div id="progressChart" class="progress-chart">
                    <p id="noTrends">Niet genoeg gegevens voor trends</p>
                </div>
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item" id="navHome">
                    <span class="icon">🏠</span>
                    <span id="navHomeText">Home</span>
                </a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item" id="navFood">
                    <span class="icon">🍽️</span>
                    <span id="navFoodText">Voeding</span>
                </a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item" id="navWorkout">
                    <span class="icon">💪</span>
                    <span id="navWorkoutText">Training</span>
                </a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item active" id="navProgress">
                    <span class="icon">📊</span>
                    <span id="navProgressText">Voortgang</span>
                </a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item" id="navSettings">
                    <span class="icon">⚙️</span>
                    <span id="navSettingsText">Instellingen</span>
                </a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="progress.js"></script>
</body>
</html>
