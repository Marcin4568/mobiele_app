<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voortgang</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <header class="header">
            <h1>Voortgang Tracking</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <main id="mainContent" class="main-content">
            <div class="section">
                <h2>Statistieken</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Workouts Voltooid</h3>
                        <p class="stat-number" id="workoutsCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Calorieën Verbrand</h3>
                        <p class="stat-number" id="caloriesBurned">0</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Lichaamsmaten</h2>
                <div class="measurements">
                    <div class="measurement-input">
                        <label>Gewicht (kg):</label>
                        <input type="number" id="weight" step="0.1" placeholder="70">
                        <button onclick="addMeasurement('weight')" class="btn-primary">Opslaan</button>
                    </div>
                    <div class="measurement-input">
                        <label>Borst (cm):</label>
                        <input type="number" id="chest" step="0.1" placeholder="100">
                        <button onclick="addMeasurement('chest')" class="btn-primary">Opslaan</button>
                    </div>
                    <div class="measurement-input">
                        <label>Taille (cm):</label>
                        <input type="number" id="waist" step="0.1" placeholder="80">
                        <button onclick="addMeasurement('waist')" class="btn-primary">Opslaan</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Meetgeschiedenis</h2>
                <div id="measurementHistory" class="measurement-history">
                    <p>Geen metingen opgeslagen</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item"><span class="icon">🍽️</span><span>Voeding</span></a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item"><span class="icon">💪</span><span>Training</span></a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item active"><span class="icon">📊</span><span>Voortgang</span></a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item"><span class="icon">⚙️</span><span>Instellingen</span></a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="progress.js"></script>
</body>
</html>
