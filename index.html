<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Gezondheid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Mijn Gezondheid</h1>
</header>

<main class="main">

  <section class="card">
    <h2>Jouw progressie</h2>
    <p id="progressText">0 van de 5 trainingen gedaan</p>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <section class="card">
    <h2>Doelstelling</h2>

    <p id="goalText">Nog geen doel</p>

    <textarea id="goalInput" placeholder="Schrijf je doel"></textarea>

    <button onclick="saveGoal()">Opslaan</button>
    <button onclick="deleteGoal()">Verwijder</button>
  </section>

  <section class="card">
    <h2>Training</h2>
    <button onclick="location.href='training.html'">Start training</button>
  </section>

  <section class="card">
    <h2>Snelle toegang</h2>

    <button onclick="location.href='workout.html'">Workouts</button>
  </section>

</main>

<script src="app.js"></script>

<footer class="footer">
  <button onclick="location.href='index.html'">Home</button>
  <button onclick="location.href='workout.html'">Workouts</button>
  <button onclick="location.href='training.html'">Training</button>
</footer>

</body>
</html>
