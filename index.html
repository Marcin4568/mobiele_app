<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mijn Gezondheid</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Mijn Gezondheid</h1>

    <select id="languageSwitch">
      <option value="nl">NL</option>
      <option value="en">EN</option>
    </select>
  </header>

  <main class="main">

    <!-- PROGRESS -->
    <section class="card">
      <h2>Jouw progressie</h2>
      <p id="progressText">3 van de 5 trainingen gedaan</p>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

  <section class="card">
    <h2>Doelstelling</h2>

    <p id="goalText">Nog geen doel ingesteld</p>

    <textarea id="goalInput" placeholder="Schrijf je doel..."></textarea>

    <button onclick="saveGoal()">Opslaan doel</button>
    <button class="secondary" onclick="deleteGoal()">Verwijder doel</button>
  </section>

    <!-- TRAINING -->
    <section class="card">
      <h2>Training</h2>
      <p>Start je workout van vandaag</p>

      <button onclick="goTraining()">Start training</button>
    </section>

    <!-- SNELLE TOEGANG -->
    <section class="card">
      <h2>Snelle toegang</h2>

      <div class="quick-buttons">
        <button onclick="location.href='workout.html'">Workouts</button>
        <button>Progressie</button>
        <button>Voeding</button>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="location.href='workout.html'">Workouts</button>
    <button onclick="location.href='training.html'">Training</button>
    <button>Voeding</button>
    <button>Instellingen</button>
  </footer>

  <script src="app.js"></script>

</body>
</html>
