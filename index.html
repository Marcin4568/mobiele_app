<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Fitness App</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="container">
        <!-- Language Switch -->
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 id="appTitle">Fitness Tracker</h1>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            <div class="overview-section">
                <div class="card">
                    <h2 id="welcomeTitle">Welkom</h2>
                    <p id="welcomeText">Start je fitness reis vandaag!</p>
                </div>

                <div class="card">
                    <h3 id="goalsTitle">Doelstellingen</h3>
                    <textarea id="goalInput" placeholder="Schrijf je doelstellingen hier..."></textarea>
                    <button id="saveGoal" onclick="saveGoal()" class="btn-primary">Opslaan</button>
                    <div id="goalDisplay" class="goal-display"></div>
                </div>

                <div class="card">
                    <h3 id="progressTitle">Recente Voortgang</h3>
                    <div id="progressOverview" class="progress-overview">
                        <p id="noProgress">Geen voortgang opgeslagen</p>
                    </div>
                </div>

                <div class="card">
                    <button onclick="navigateTo('training')" class="btn-cta" id="startTrainingBtn">Start Training</button>
                </div>
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item active" id="navHome">
                    <span class="icon">🏠</span>
                    <span id="navHomeText">Home</span>
                </a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item" id="navFood">
                    <span class="icon">🍽️</span>
                    <span id="navFoodText">Voeding</span>
                </a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item" id="navWorkout">
                    <span class="icon">💪</span>
                    <span id="navWorkoutText">Training</span>
                </a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item" id="navProgress">
                    <span class="icon">📊</span>
                    <span id="navProgressText">Voortgang</span>
                </a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item" id="navSettings">
                    <span class="icon">⚙️</span>
                    <span id="navSettingsText">Instellingen</span>
                </a>
            </nav>
        </footer>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
