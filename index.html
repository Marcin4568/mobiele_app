<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mijn Gezondheid</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <img src="logo.png" alt="Logo" />
    </div>

    <div class="header-right">
      <select id="languageSwitch">
        <option value="nl">NL</option>
        <option value="en">EN</option>
      </select>

      <button class="overview-btn">Overzicht</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- START TRAINING -->
    <section class="card">
      <h2>Training</h2>
      <button class="primary-btn">Start training</button>
    </section>

    <!-- SNELLE TOEGANG -->
    <section class="card">
      <h2>Snelle toegang</h2>

      <div class="quick-buttons">
        <button>Spiergroepen</button>
        <button>Progressie</button>
        <button>Voeding</button>
      </div>
    </section>

    <!-- DOELSTELLING -->
    <section class="card">
      <h2>Doelstelling</h2>
      <textarea placeholder="Schrijf je doel hier..."></textarea>
    </section>

  </main>

  <!-- FOOTER NAV -->
  <footer class="footer">
    <button>Home</button>
    <button>Workouts</button>
    <button>Voeding</button>
    <button>Progressie</button>
    <button>Instellingen</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
