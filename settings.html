<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <header class="header">
            <h1>Instellingen</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <main id="mainContent" class="main-content">
            <div class="section">
                <h2>Profielinstellingen</h2>
                <div class="setting-item">
                    <label>Naam:</label>
                    <input type="text" id="userName" placeholder="Voer je naam in">
                </div>
                <div class="setting-item">
                    <label>Leeftijd:</label>
                    <input type="number" id="userAge" min="10" max="100" placeholder="Voer je leeftijd in">
                </div>
                <button onclick="saveProfile()" class="btn-primary">Profiel Opslaan</button>
            </div>

            <div class="section">
                <h2>Gegevensbeheer</h2>
                <div class="data-buttons">
                    <button onclick="exportData()" class="btn-secondary">📥 Gegevens Exporteren</button>
                    <button onclick="clearData()" class="btn-danger">🗑️ Alle Gegevens Wissen</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item"><span class="icon">🍽️</span><span>Voeding</span></a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item"><span class="icon">💪</span><span>Training</span></a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item"><span class="icon">📊</span><span>Voortgang</span></a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item active"><span class="icon">⚙️</span><span>Instellingen</span></a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="settings.js"></script>
</body>
</html>
