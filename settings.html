<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Language Switch -->
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 id="pageTitle">Instellingen</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            <!-- Language Settings -->
            <div class="section">
                <h2 id="languageTitle">Taal Instellingen</h2>
                <div class="setting-item">
                    <label id="languageLabel">Kies je taal:</label>
                    <div class="language-buttons">
                        <button onclick="setLanguage('nl')" class="lang-setting-btn active" id="langNlBtn">
                            <span class="flag">🇳🇱</span> Nederlands
                        </button>
                        <button onclick="setLanguage('en')" class="lang-setting-btn" id="langEnBtn">
                            <span class="flag">🇬🇧</span> English
                        </button>
                    </div>
                </div>
            </div>

            <!-- Profile Settings -->
            <div class="section">
                <h2 id="profileTitle">Profielinstellingen</h2>
                <div class="setting-item">
                    <label id="nameLabel">Naam:</label>
                    <input type="text" id="userName" placeholder="Voer je naam in">
                </div>
                <div class="setting-item">
                    <label id="ageLabel">Leeftijd:</label>
                    <input type="number" id="userAge" min="10" max="100" placeholder="Voer je leeftijd in">
                </div>
                <div class="setting-item">
                    <label id="genderLabel">Geslacht:</label>
                    <select id="userGender" class="select-input">
                        <option value="">Selecteer</option>
                        <option value="male" id="maleOpt">Man</option>
                        <option value="female" id="femaleOpt">Vrouw</option>
                        <option value="other" id="otherOpt">Anders</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label id="fitnessGoalLabel">Fitnessdoel:</label>
                    <select id="fitnessGoal" class="select-input">
                        <option value="">Selecteer</option>
                        <option value="lose-weight" id="loseWeightOpt">Gewicht verliezen</option>
                        <option value="gain-muscle" id="gainMuscleOpt">Spieren opbouwen</option>
                        <option value="maintenance" id="maintenanceOpt">Gewicht behouden</option>
                    </select>
                </div>
                <button onclick="saveProfile()" class="btn-primary" id="saveProfileBtn">Profiel Opslaan</button>
            </div>

            <!-- Notification Settings -->
            <div class="section">
                <h2 id="notificationsTitle">Meldingen</h2>
                <div class="setting-item">
                    <label id="remindersLabel">
                        <input type="checkbox" id="reminders" checked>
                        <span>Herinneringen inschakelen</span>
                    </label>
                </div>
                <div class="setting-item">
                    <label id="soundLabel">
                        <input type="checkbox" id="soundNotifications" checked>
                        <span>Geluid inschakelen</span>
                    </label>
                </div>
            </div>

            <!-- Data Management -->
            <div class="section">
                <h2 id="dataTitle">Gegevensbeheer</h2>
                <div class="data-buttons">
                    <button onclick="exportData()" class="btn-secondary" id="exportBtn">📥 Gegevens Exporteren</button>
                    <button onclick="clearData()" class="btn-danger" id="clearBtn">🗑️ Alle Gegevens Wissen</button>
                </div>
            </div>

            <!-- About -->
            <div class="section">
                <h2 id="aboutTitle">Over</h2>
                <div class="about-info">
                    <p><strong id="appNameLabel">App Naam:</strong> Fitness Tracker</p>
                    <p><strong id="versionLabel">Versie:</strong> 1.0.0</p>
                    <p><strong id="createdLabel">Gemaakt voor jouw fitness doelen</strong></p>
                </div>
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item" id="navHome">
                    <span class="icon">🏠</span>
                    <span id="navHomeText">Home</span>
                </a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item" id="navFood">
                    <span class="icon">🍽️</span>
                    <span id="navFoodText">Voeding</span>
                </a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item" id="navWorkout">
                    <span class="icon">💪</span>
                    <span id="navWorkoutText">Training</span>
                </a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item" id="navProgress">
                    <span class="icon">📊</span>
                    <span id="navProgressText">Voortgang</span>
                </a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item active" id="navSettings">
                    <span class="icon">⚙️</span>
                    <span id="navSettingsText">Instellingen</span>
                </a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="settings.js"></script>
</body>
</html>
