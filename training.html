<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Language Switch -->
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 id="pageTitle">Training Plan</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            <!-- Difficulty Selection -->
            <div id="difficultySection" class="section">
                <h2 id="selectDifficultyTitle">Kies Moeilijkheidsgraad</h2>
                <div class="difficulty-grid">
                    <button onclick="selectDifficulty('easy')" class="difficulty-btn easy" id="easyBtn">
                        <span class="icon">🟢</span>
                        <span id="easyText">Makkelijk</span>
                    </button>
                    <button onclick="selectDifficulty('medium')" class="difficulty-btn medium" id="mediumBtn">
                        <span class="icon">🟡</span>
                        <span id="mediumText">Gemiddeld</span>
                    </button>
                    <button onclick="selectDifficulty('hard')" class="difficulty-btn hard" id="hardBtn">
                        <span class="icon">🔴</span>
                        <span id="hardText">Moeilijk</span>
                    </button>
                </div>
            </div>

            <!-- Workout Display -->
            <div id="workoutSection" class="section" style="display: none;">
                <h2 id="todayWorkoutTitle">Training van Vandaag</h2>
                <div class="workout-display">
                    <div class="exercise-card">
                        <h3 id="exerciseName">Oefening</h3>
                        <div class="exercise-details">
                            <p><strong id="setsLabel">Series:</strong> <span id="setsValue">0</span></p>
                            <p><strong id="repsLabel">Herhalingen:</strong> <span id="repsValue">0</span></p>
                            <p><strong id="restLabel">Rust:</strong> <span id="restValue">0s</span></p>
                        </div>
                        <div class="exercise-tracker">
                            <input type="number" id="completedSets" min="0" placeholder="Afgeronde series">
                            <button onclick="completeExercise()" class="btn-primary" id="completeBtn">Afgerond</button>
                        </div>
                    </div>
                </div>

                <div class="navigation-buttons">
                    <button onclick="previousExercise()" class="btn-secondary" id="prevBtn">← Vorige</button>
                    <span id="exerciseCounter">1 / 1</span>
                    <button onclick="nextExercise()" class="btn-secondary" id="nextBtn">Volgende →</button>
                </div>

                <div class="action-buttons">
                    <button onclick="finishTraining()" class="btn-success" id="finishBtn">Training Afronden</button>
                    <button onclick="cancelTraining()" class="btn-danger" id="cancelBtn">Annuleren</button>
                </div>
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item" id="navHome">
                    <span class="icon">🏠</span>
                    <span id="navHomeText">Home</span>
                </a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item" id="navFood">
                    <span class="icon">🍽️</span>
                    <span id="navFoodText">Voeding</span>
                </a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item active" id="navWorkout">
                    <span class="icon">💪</span>
                    <span id="navWorkoutText">Training</span>
                </a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item" id="navProgress">
                    <span class="icon">📊</span>
                    <span id="navProgressText">Voortgang</span>
                </a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item" id="navSettings">
                    <span class="icon">⚙️</span>
                    <span id="navSettingsText">Instellingen</span>
                </a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="training.js"></script>
</body>
</html>
