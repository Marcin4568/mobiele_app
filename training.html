<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Training</h1>
</header>

<main class="main">

  <!-- START -->
  <section class="card">
    <h2>Start je training</h2>

    <button id="startBtn">Start training</button>

    <div class="quick-buttons">
      <button onclick="setLevel('easy')">Easy</button>
      <button onclick="setLevel('medium')">Medium</button>
      <button onclick="setLevel('hard')">Hard</button>
    </div>
  </section>

  <!-- TRAINING BOX -->
  <section class="card" id="box" style="display:none;">
    <h2 id="title">Training</h2>

    <p id="step"></p>

    <button id="nextBtn">Volgende stap</button>
    <button id="resetBtn">Reset</button>
  </section>

</main>

<footer class="footer">
  <button onclick="location.href='index.html'">Home</button>
  <button onclick="location.href='workout.html'">Workout</button>
  <button onclick="location.href='training.html'">Training</button>
</footer>

<script src="training.js"></script>
</body>
</html>
