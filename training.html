<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <header class="header">
            <h1>Training Plan</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <main id="mainContent" class="main-content">
            <div id="difficultySection" class="section">
                <h2>Kies Moeilijkheidsgraad</h2>
                <div class="difficulty-grid">
                    <button onclick="selectDifficulty('easy')" class="difficulty-btn easy">
                        <span class="icon">🟢</span>
                        <span>Makkelijk</span>
                    </button>
                    <button onclick="selectDifficulty('medium')" class="difficulty-btn medium">
                        <span class="icon">🟡</span>
                        <span>Gemiddeld</span>
                    </button>
                    <button onclick="selectDifficulty('hard')" class="difficulty-btn hard">
                        <span class="icon">🔴</span>
                        <span>Moeilijk</span>
                    </button>
                </div>
            </div>

            <div id="workoutSection" class="section" style="display: none;">
                <h2>Training van Vandaag</h2>
                <div class="workout-display">
                    <div class="exercise-card">
                        <h3 id="exerciseName">Oefening</h3>
                        <div class="exercise-details">
                            <p><strong>Series:</strong> <span id="setsValue">0</span></p>
                            <p><strong>Herhalingen:</strong> <span id="repsValue">0</span></p>
                            <p><strong>Rust:</strong> <span id="restValue">0s</span></p>
                        </div>
                        <div class="exercise-tracker">
                            <input type="number" id="completedSets" min="0" placeholder="Afgeronde series">
                            <button onclick="completeExercise()" class="btn-primary">Afgerond</button>
                        </div>
                    </div>
                </div>

                <div class="navigation-buttons">
                    <button onclick="previousExercise()" class="btn-secondary">← Vorige</button>
                    <span id="exerciseCounter">1 / 1</span>
                    <button onclick="nextExercise()" class="btn-secondary">Volgende →</button>
                </div>

                <div class="action-buttons">
                    <button onclick="finishTraining()" class="btn-success">Training Afronden</button>
                    <button onclick="cancelTraining()" class="btn-danger">Annuleren</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item"><span class="icon">🍽️</span><span>Voeding</span></a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item active"><span class="icon">💪</span><span>Training</span></a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item"><span class="icon">📊</span><span>Voortgang</span></a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item"><span class="icon">⚙️</span><span>Instellingen</span></a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="training.js"></script>
</body>
</html>
