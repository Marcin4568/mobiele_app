<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Voortgang</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button id="langNl" class="lang-btn active">NL</button>
            <button id="langEn" class="lang-btn">EN</button>
        </div>

        <header class="header">
            <h1>Workout Voortgang</h1>
            <button onclick="navigateTo('index')" class="btn-back">← Terug</button>
        </header>

        <main id="mainContent" class="main-content">
            <div class="section">
                <h2>Start een Workout</h2>
                <button onclick="startNewWorkout()" class="btn-cta">Start Nieuw Workout</button>
            </div>

            <div class="section">
                <h2>Workout Historie</h2>
                <div id="workoutHistory" class="workout-history">
                    <p>Geen workouts opgeslagen</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <nav class="nav-footer">
                <a href="#" onclick="navigateTo('index')" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
                <a href="#" onclick="navigateTo('nutrition')" class="nav-item"><span class="icon">🍽️</span><span>Voeding</span></a>
                <a href="#" onclick="navigateTo('workout')" class="nav-item active"><span class="icon">💪</span><span>Training</span></a>
                <a href="#" onclick="navigateTo('progress')" class="nav-item"><span class="icon">📊</span><span>Voortgang</span></a>
                <a href="#" onclick="navigateTo('settings')" class="nav-item"><span class="icon">⚙️</span><span>Instellingen</span></a>
            </nav>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="workout.js"></script>
</body>
</html>
