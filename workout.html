<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Workout Dashboard</h1>
</header>

<main class="main">

  <!-- PROGRESS -->
  <section class="card">
    <h2>Week progress</h2>

    <p id="text"></p>

    <div class="progress-bar">
      <div class="progress-fill" id="bar"></div>
    </div>
  </section>

  <!-- WEEK -->
  <section class="card">
    <h2>Week overzicht</h2>
    <ul id="list"></ul>
  </section>

  <!-- STATS -->
  <section class="card">
    <h2>Statistieken</h2>
    <p id="stats"></p>
  </section>

  <!-- START -->
  <section class="card">
    <h2>Training starten</h2>
    <button onclick="location.href='training.html'">Start training</button>
  </section>

</main>

<footer class="footer">
  <button onclick="location.href='index.html'">Home</button>
  <button onclick="location.href='workout.html'">Workout</button>
  <button onclick="location.href='training.html'">Training</button>
</footer>

<script src="workout.js"></script>
</body>
</html>
