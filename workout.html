<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workouts</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body class="page-workout">

<header class="header">
  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>

  <nav class="top-nav">
    <button id="langBtn">EN</button>
    <a href="index.html">Home</a>
  </nav>
</header>

<main class="workout-main">

  <!-- WEEKOVERZICHT -->
  <section class="week-overview">
    <h1 id="weekTitle">Workout overzicht</h1>
    <div class="days" id="daysContainer"></div>
  </section>

  <!-- TRAINING -->
  <section class="training-runner">
    <h2 id="trainingTitle">Training van vandaag</h2>

    <div class="runner-card">
      <p class="runner-day" id="todayDay">Vandaag:</p>
      <h3 class="runner-workout" id="todayWorkout">Nog niet gestart</h3>

      <div id="exerciseBox" class="exercise-box">
        <p id="exerciseLabel">Druk op start om je eerste oefening te zien.</p>
      </div>

      <div class="runner-buttons">
        <button id="startTrainingBtn" class="primary-btn">Start training</button>
        <button id="nextExerciseBtn" class="secondary-btn" disabled>Volgende oefening</button>
        <button id="finishWorkoutBtn" class="danger-btn" disabled>Training afronden</button>
        <button id="resetWorkoutBtn" class="reset-btn">Opnieuw doen</button>
      </div>

    </div>
  </section>

</main>

<footer class="footer">
  <a href="index.html">Home</a>
  <a href="workout.html">Workouts</a>
  <a href="#">Voeding</a>
  <a href="#">Progressie</a>
  <a href="#">Instellingen</a>
</footer>

<script src="workout.js"></script>

</body>
</html>
